[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engineering-portfolio"
version = "0.1.0"
description = "Learning LangChain, LangGraph and LangFlow: RAG, vector DBs and agents, fully local with Ollama"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3",
    "langchain-core",
    "langchain-ollama",
    "pydantic>=2",
    "python-dotenv",
]

[tool.setuptools]
packages = ["common"]
